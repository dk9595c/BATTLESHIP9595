<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship Arena - Play with Online Players</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darkest: rgb(32, 33, 36);
            --bg-dark: rgb(49, 49, 52);
            --bg-light: rgb(66, 66, 66);
            --border-color: rgb(123, 128, 131);
            --text-primary: #e8eaec;
            --text-secondary: #9a9da8;
            --accent-blue: rgb(91, 136, 238);
            --accent-red: #cc071e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-darkest);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        a, button {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            border: none;
            border-radius: 4px;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--bg-darkest);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid var(--bg-dark);
        }

        .header .logo { line-height: 0; }
        .header .logo svg { height: 25px; width: auto; }

        .header nav a {
            margin: 0 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .header nav a:hover { color: var(--text-primary); }

        .header .user-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: transparent;
            overflow: hidden;
        }

        /* --- Main Content Area --- */
        .content-area {
            padding: 108px 3rem 4rem 3rem;
            max-width: 1800px;
            margin: 0 auto;
        }

        .page-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem; 
            font-weight: 500;   
            margin-bottom: 2rem;
            color: var(--text-primary);
        }

        /* --- Grid Layout --- */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 160px);
            gap: 2.5rem 1.5rem;
            justify-content: center;
        }

        /* --- Card Styles --- */
        .card {
            width: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover .card-title {
            text-decoration: underline;
        }

        .card-image {
            width: 100%;
            height: 160px;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .card-image svg {
            width: 100%;
            height: auto;
            max-height: 100%;
            display: block;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            padding-top: 0.75rem; 
        }

        .card-title {
            font-size: 1.1rem; 
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.25rem; 
            color: var(--text-primary);
        }

        .card-subtitle {
            font-size: 0.9rem; 
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
    </style>
</head>

    <script>
        // --- HAIKEI AVATAR GENERATOR FUNCTIONS ---
        const rand = (min, max) => Math.random() * (max - min) + min;
        const randInt = (min, max) => Math.floor(rand(min, max));
        const randChoice = (arr) => arr[randInt(0, arr.length)];

        const PALETTES = {
            redAlert: ["rgb(32, 33, 36)", "rgb(49, 49, 52)", "#cc071e", "rgb(123, 128, 131)", "rgb(66, 66, 66)"],
            blueOps: ["rgb(32, 33, 36)", "rgb(49, 49, 52)", "rgb(91, 136, 238)", "#9a9da8", "rgb(66, 66, 66)"],
            ghostGrey: ["rgb(32, 33, 36)", "rgb(66, 66, 66)", "rgb(123, 128, 131)", "#9a9da8", "#e8eaec"],
            combo: ["rgb(49, 49, 52)", "rgb(32, 33, 36)", "#cc071e", "rgb(91, 136, 238)", "#9a9da8"]
        };

        function randomBlob(width, height) {
            const radius = rand(25, 40); 
            const cx = width / 2 + rand(-10, 10);
            const cy = height / 2 + rand(-10, 10);
            const points = [];
            const n = randInt(6, 12);
            for (let i = 0; i < n; i++) {
                const angle = (i / n) * Math.PI * 2;
                const r = radius * (0.7 + Math.random() * 0.6);
                points.push([cx + Math.cos(angle) * r, cy + Math.sin(angle) * r]);
            }
            return points.map(([x, y], i) => (i === 0 ? `M${x},${y}` : `L${x},${y}`)).join(" ") + "Z";
        }

        function layeredWaves(width, height, layers, palette) {
            let svg = "";
            for (let i = 0; i < layers; i++) {
                const amp = rand(10, 25);
                const y = height - (i * height) / layers + rand(-10, 10);
                let d = `M0 ${y}`;
                const seg = randInt(4, 8);
                const step = width / seg;
                for (let j = 0; j <= seg; j++) {
                    const x = j * step;
                    const waveY = y + Math.sin(j * 0.5 + Math.random()) * amp;
                    d += ` L${x} ${waveY}`;
                }
                d += ` L${width} ${height} L0 ${height}Z`;
                svg += `<path d="${d}" fill="${palette[i % palette.length]}" opacity="${0.8 - i * 0.15}"/>`;
            }
            return svg;
        }

        function randomSun(width, height, palette) {
            const color = randChoice(palette.slice(2)); 
            const cx = rand(width * 0.2, width * 0.8);
            const cy = rand(height * 0.1, height * 0.3); 
            const r = rand(8, 15); 
            return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="0.85"/>`;
        }

        function gradientDef(id, palette) {
            const c1 = palette[0];
            const c2 = palette[1];
            return `
                <defs>
                  <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${c1}" />
                    <stop offset="100%" stop-color="${c2}" />
                  </linearGradient>
                </defs>
            `;
        }

        function generateBeautifulSVG() {
            const width = 100;
            const height = 100;
            const paletteNames = Object.keys(PALETTES);
            const randomPaletteName = randChoice(paletteNames);
            const palette = PALETTES[randomPaletteName];
            const style = randChoice(["waves", "blobs", "hybrid"]);
            const bgId = "grad" + randInt(0, 9999);

            let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid slice">`;
            svg += gradientDef(bgId, palette);
            svg += `<rect width="${width}" height="${height}" fill="url(#${bgId})"/>`;

            if (style === "waves") {
                svg += layeredWaves(width, height, randInt(3, 5), palette.slice(1)); 
                if (Math.random() > 0.5) svg += randomSun(width, height, palette);
            } else if (style === "blobs") {
                const count = randInt(3, 6);
                for (let i = 0; i < count; i++) {
                    const color = palette[(i + 1) % palette.length];
                    const blob = randomBlob(width, height); 
                    svg += `<path d="${blob}" fill="${color}" opacity="${0.55 - i * 0.07}"/>`;
                }
            } else {
                svg += layeredWaves(width, height, 3, palette.slice(1));
                svg += randomSun(width, height, palette);
                const blob = randomBlob(width, height); 
                svg += `<path d="${blob}" fill="${randChoice(palette)}" opacity="0.35"/>`;
            }

            svg += "</svg>";
            return svg;
        }

        // --- FETCH AND RENDER LOGIC ---
        async function loadAllOnlinePlayers() {
            const SERVER_URL = "https://battleship-server-r5pa.onrender.com";
            const grid = document.getElementById('full-player-grid');

            try {
                const response = await fetch(`${SERVER_URL}/?action=getLobbyData`);
                
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                let onlinePlayers = await response.json();

                // To emulate a full page directory, we dynamically multiply the returned batch 
                // and give each one a unique procedural avatar so the grid looks beautifully populated.
                while(onlinePlayers.length < 30) {
                    onlinePlayers = onlinePlayers.concat(onlinePlayers.map(p => ({...p, id: Math.random()})));
                }
                
                // Cap the grid at 40 elements for optimal visual density
                onlinePlayers = onlinePlayers.slice(0, 40);

                grid.innerHTML = ''; 

                onlinePlayers.forEach(player => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => window.location.href = 'Gameplay.html?opponent=' + encodeURIComponent(player.username);
                    
                    // Generating a local SVG instead of using the repeated one from the small server payload
                    const dynamicSVG = generateBeautifulSVG();

                    card.innerHTML = `
                        <div class="card-image">
                            ${dynamicSVG}
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${player.username}</h3>
                            <p class="card-subtitle">${player.rank} • ${player.country}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Failed to load players grid:", error);
                grid.innerHTML = `
                    <div class="loading-state" style="color: var(--accent-red);">
                        Failed to connect to the server. Please try refreshing the page.
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadAllOnlinePlayers();

            // Render header profile avatar
            const userProfile = document.querySelector('.user-profile');
            if (userProfile) {
                userProfile.innerHTML = generateBeautifulSVG();
            }
        });
    </script>
</body>
</html>
